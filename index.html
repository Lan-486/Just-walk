<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A hand-drawn walking experience controlled by alternating mouse clicks."
  >

<link rel="stylesheet" href="./reset.css">
<link rel="stylesheet" href="./style.css">
<script src="./script.js" defer></script>


  <title>Just Walk</title>

 

</head>

<body>
  <main class="page">
    <!-- Third-person view connects each mouse button to its matching foot. -->
    <button id="start-button" type="button" hidden>
  Start walking
</button>

    <section
      id="game"
      aria-label="Just Walk tutorial"
      aria-describedby="controls"
    >
    <h1 class="game-title">Just Walk</h1>

      <img
        id="background"
        src="./images/首图.png"
        alt=""
        draggable="false"
      >

      <img
        id="character"
        class="art-layer"
        src="./images/角色站.png"
        alt="Character standing with both feet on the ground"
        draggable="false"
      >

      <img
        id="dialogue"
        class="art-layer"
        src="./images/对话框.png"
        alt=""
        draggable="false"
      >

      <img
        id="mouse"
        class="art-layer"
        src="./images/鼠标.png"
        alt=""
        draggable="false"
      >

      <p id="instruction" role="status" aria-live="polite">
        Alternate left and right clicks to walk.
      </p>
    </section>

    <p id="controls" class="help">
      Left click: left foot · Right click: right foot
    </p>
  </main>
</body>
</html>
